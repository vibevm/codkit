# conform.toml — this project's AI-Native discipline policy
# (ENGINE-CONFORM; generated by `typescript-ai-native init`, then owned by you).
#
# The [typescript] table drives the ts-tsc structural gate
# (`typescript-ai-native-conform`): the §8 unsafe-set ban, cell isolation over
# import specifiers, and the file-length budget. Cells start EXEMPT and
# flip into `gated` one by one, each after its findings drain to zero
# (expand-as-you-conform — a flip must never widen a baseline). Rust-side
# keys stay at their defaults until Rust code joins the tree.

max_file_lines = 600

[typescript]
roots = ["packages/codkit/src", "packages/codkit/test", "packages/type-api/src", "packages/type-api/test", "packages/type-vscode/src", "packages/type-vscode/test"]
exclude_substrings = ["/fixtures/"]
gated = []
# codkit currently has module cells, not the `<cells_dir>/<cell>/index.ts`
# topology enforced by ts-cell-isolation. Add cells_dir only with that migration.
seam = "index"

[[typescript.floor_disable]]
step = "tests"
reason = "codkit uses Vitest; the installed floor hard-codes node --test. `npm run floor` runs Vitest before this structural floor."

[[typescript.floor_disable]]
step = "eslint"
reason = "typescript-eslint 8.68 supports TypeScript <6.1, while codkit requires TypeScript 7.0.2; revisit on the first typescript-eslint release whose peer range includes TS 7."

[[typescript.floor_disable]]
step = "test-gate"
reason = "the installed xfail gate hard-codes node --test and cannot consume the Vitest suite; Vitest remains mandatory in `npm run floor`."
