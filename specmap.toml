# specmap.toml — this project's traceability policy
# (PROP-014; generated by `typescript-ai-native init`, then owned by you).

# The spec:// namespace this project's units are minted under.
namespace = "codkit"

scan_roots = ["codkit/*"]
spec_roots = ["vibevm/vibespecs"]
root_spec_docs = []
# The installed TypeScript-7 extractor currently degrades every file because it
# expects the removed legacy Compiler API. `npm run trace:check` is the mandatory
# non-vacuous project gate over all first-line @scope markers until DBT-0004 is
# closed; the package orphan gate remains exempt so its empty result cannot pose
# as proof.
exempt = ["codkit"]
dispositioned = []

