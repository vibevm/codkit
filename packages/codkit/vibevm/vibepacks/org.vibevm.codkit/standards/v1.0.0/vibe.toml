[package]
name = "standards"
group = "org.vibevm.codkit"
kind = "flow"
version = "1.0.0"
epoch = 1
format = "normal"
authors = ["Oleg Chirukhin"]
license = "UPL-1.0"
description = "The default codkit standards for a patch set over any fork codkit maintains: the delta as a parallel system in upstream's own style, a feature as one folder behind a flag, what a minimal intervention is, how a choice of layer is presented, how a product keeps its seam map, and how the own catalogue documents and routes itself"
keywords = ["codkit", "standards", "fork", "patch-set", "minimal-intervention", "parallel-system", "feature-flags"]

[compatibility]
min_vibe_version = "0.1.0"
requires_kinds = []

[boot_snippet]
source = "vibevm/vibespecs/boot/75-flow-codkit-standards.xml"
category = "flow"
# The seam map is a norm of this standard (`LAW-SEAM-MAP-PER-PIN`): the product keeps
# one per pin, whatever it forks. The catalogue a map is filled in from belongs to the
# project type and declares the same lexeme, so neither package reads as borrowing it.
concepts = ["seam map"]
